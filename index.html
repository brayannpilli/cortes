<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cortes</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0f0f10; color: #f2f2f2;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 26rem; padding: 2rem; text-align: center; }
  .logo { width: 3rem; height: 3rem; margin: 0 auto 1rem; border-radius: .75rem; background: #f68c36; display: grid; place-items: center; font-size: 1.5rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { color: #a1a1aa; margin: 0 0 1rem; }
  button { font: inherit; padding: .6rem 1.2rem; border: 0; border-radius: 999px; background: #f68c36; color: #111; font-weight: 600; cursor: pointer; }
  .spin { width: 1.5rem; height: 1.5rem; margin: 0 auto; border: 3px solid #333; border-top-color: #f68c36; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">✂</div>
  <h1 id="titulo">Abriendo Cortes…</h1>
  <p id="texto">Buscando el link vigente.</p>
  <div id="spin" class="spin" aria-hidden="true"></div>
  <button id="otra" hidden>Probar de nuevo</button>
</main>
<script>
// El PC que publica Cortes cambia de link cada vez que reabre el túnel y lo guarda en link.json.
// Se lee por la API de GitHub (sin caché) y, si la app responde, se entra.
const titulo = document.getElementById("titulo"), texto = document.getElementById("texto");
const spin = document.getElementById("spin"), otra = document.getElementById("otra");
otra.onclick = () => location.reload();

function apagada(msg) {
  titulo.textContent = "Cortes está apagado";
  texto.textContent = msg;
  spin.hidden = true;
  otra.hidden = false;
}

async function abrir() {
  try {
    const r = await fetch("https://api.github.com/repos/brayannpilli/cortes/contents/link.json?ref=main",
      { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store" });
    if (!r.ok) throw new Error("sin link");
    const { url } = await r.json();
    if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url)) throw new Error("link no válido");
    // ¿Responde? (no-cors: solo importa si la conexión llega; un túnel caído falla al instante)
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 12000);
    await fetch(url + "/api/auth/me", { mode: "no-cors", cache: "no-store", signal: ctl.signal });
    clearTimeout(t);
    location.replace(url + location.hash);
  } catch {
    apagada("El equipo que la publica no está conectado ahora mismo. Cuando se abra «Cortes en linea» en ese PC, vuelve a cargar esta página.");
  }
}
abrir();
</script>
</body>
</html>
